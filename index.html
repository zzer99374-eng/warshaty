function normalize(x){ const b = blank(); for(const k in b){ if(x && x[k] !== undefined) b[k] = x[k]; } return b; }

function supabaseReady(){ return !!(CFG.SUPABASE_URL && CFG.SUPABASE_ANON_KEY && !CFG.SUPABASE_URL.includes("YOUR_")); }

async function initAuth(){
  if(!supabaseReady()){ authMode = false; return null; }
  sb = window.supabase.createClient(CFG.SUPABASE_URL, CFG.SUPABASE_ANON_KEY);
  authMode = true;
  const {data} = await sb.auth.getSession(); session = data.session;
  sb.auth.onAuthStateChange((_event, s) => { const prev = session; session = s;
    if(_event === "PASSWORD_RECOVERY"){ recovering = true; renderRecovery(); return; }
    if(recovering) return;
    if(s){ if(!S || !prev || prev.user.id !== s.user.id) bootCloud(); } else { profile=null; S=null; baseMap=new Map(); wm=null; workshopStatus=null; features=null; renderAuth(); } });
  return session;
}

async function loadProfile(){
  if(!sb || !session) return null;
  const {data,error} = await sb.from("profiles").select("id,workshop_id,role,name,technician_id").eq("id",session.user.id).single();
  if(error) throw error; profile=data;
  /* حالة الورشة */
  try{
    const {data: w} = await sb.from("workshops").select("status,subscription_end,suspended_reason").eq("id",data.workshop_id).single();
    workshopStatus = w || { status: "active" };
  }catch(_){ workshopStatus = { status: "active" }; }
  /* مميزات الورشة */
  try{
    const {data: f} = await sb.from("workshop_features").select("key,enabled").eq("workshop_id", data.workshop_id);
    features = {};
    (f||[]).forEach(x => { features[x.key] = !!x.enabled; });
  }catch(_){ features = null; }
  return data;
}

/* helper: هل الميزة متاحة؟ */
function hasFeature(k){
  if(!authMode) return true;             /* الوضع المحلي: كل حاجة متاحة */
  if(!features) return true;             /* لسه ما اتحملوش: ما نمنعش */
  return !!features[k];
}

async function loadState(){
  if(authMode){
    if(!session) return null;
    await loadProfile();
    storeKind="supabase";
    return await cloudLoad();
  }
  try{
    const cl = window.claude && window.claude.use ? await window.claude.use("db") : null;
    if(cl){ db = cl; doc = db.doc("workshop/state"); const snap = await doc.get(); storeKind = "db"; if(snap.exists) return normalize(snap.data().state ? JSON.parse(snap.data().state) : snap.data()); return seed(); }
  }catch(e){ db=null; doc=null; }
  try{ const raw=localStorage.getItem(LS_KEY); if(raw) return normalize(JSON.parse(raw)); }catch(e){}
  return seed();
}

/* ---------- cloud sync: one row per record, delta pull, local cache ---------- */
const KINDS=["customers","vehicles","parts","techs","jobs","appts","expenses"];
const REC="workshop_records";
let wid=null, wm=null, baseMap=new Map(), pulling=false, cacheTimer=null;
const keyOf=(k,id)=>k+"/"+id;
const splitKey=key=>{ const i=key.indexOf("/"); return [key.slice(0,i),key.slice(i+1)]; };
function canon(v){
  if(v===null||v===undefined) return "null";
  if(typeof v!=="object") return JSON.stringify(v);
  if(Array.isArray(v)) return "["+v.map(canon).join(",")+"]";
  return "{"+Object.keys(v).filter(k=>v[k]!==undefined).sort().map(k=>JSON.stringify(k)+":"+canon(v[k])).join(",")+"}";
}
const metaOf=s=>({settings:s.settings||{},seq:Number(s.seq)||0,demo:!!s.demo,audit:(s.audit||[]).slice(0,100)});
function snapshotMap(s){
  const m=new Map();
  for(const k of KINDS) for(const x of (s[k]||[])) m.set(keyOf(k,x.id),canon(x));
  m.set("meta/main",canon(metaOf(s)));
  return m;
}
function idb(){ return new Promise((res,rej)=>{ const r=indexedDB.open("warshaty",1); r.onupgradeneeded=()=>r.result.createObjectStore("kv"); r.onsuccess=()=>res(r.result); r.onerror=()=>rej(r.error); }); }
async function kvGet(k){ try{ const d=await idb(); return await new Promise((res,rej)=>{ const q=d.transaction("kv").objectStore("kv").get(k); q.onsuccess=()=>res(q.result); q.onerror=()=>rej(q.error); }); }catch(e){ return null; } }
async function kvSet(k,v){ try{ const d=await idb(); await new Promise((res,rej)=>{ const t=d.transaction("kv","readwrite"); if(v==null) t.objectStore("kv").delete(k); else t.objectStore("kv").put(v,k); t.oncomplete=()=>res(); t.onerror=()=>rej(t.error); }); }catch(e){} }
const cacheKey=()=>"cache:"+wid;
function cacheSoon(){ clearTimeout(cacheTimer); cacheTimer=setTimeout(()=>{ if(wid) kvSet(cacheKey(),{wm,rows:Array.from(baseMap.entries())}); },3000); }
function applyRowsToState(st,rows){
  for(const k of KINDS) st[k]=[];
  for(const [key,json] of rows){ const [k,id]=splitKey(key); const v=JSON.parse(json); if(k==="meta"){ st.settings=v.settings||st.settings; st.seq=v.seq||st.seq; st.demo=!!v.demo; st.audit=v.audit||[]; } else if(st[k]) st[k].push(v); }
}
async function cloudLoad(){
  wid=profile.workshop_id; baseMap=new Map(); wm=null;
  const st=blank(); st.demo=false;
  const cached=await kvGet(cacheKey());
  if(cached && Array.isArray(cached.rows)){ baseMap=new Map(cached.rows); wm=cached.wm||null; applyRowsToState(st,baseMap); }
  S=st;
  await cloudPull(true);
  if(baseMap.size===0 && isOwner()){
    try{ const old=await sb.from("workshop_state").select("state").eq("workshop_id",wid).maybeSingle(); if(old.data?.state) S=normalize(old.data.state); }catch(e){}
    S.demo=false;
    await cloudPush(true);
    await cloudPull(true);
  }
  return normalize(S);
}
function fixDupNos(){
  const by=new Map(); S.jobs.forEach(j=>{ if(!by.has(j.no)) by.set(j.no,[]); by.get(j.no).push(j); });
  let fixed=false;
  for(const l of by.values()){ if(l.length<2) continue;
    l.sort((a,b)=>String(a.createdAt||"").localeCompare(String(b.createdAt||""))||String(a.id).localeCompare(String(b.id)));
    for(let i=1;i<l.length;i++){ l[i].no=++S.seq; fixed=true; } }
  return fixed;
}
async function cloudPull(){
  if(!sb||!wid) return false;
  if(wm){
    const head=await sb.from(REC).select("updated_at").eq("workshop_id",wid).order("updated_at",{ascending:false}).limit(1);
    if(head.error) throw head.error;
    const top=head.data&&head.data[0];
    if(!top || new Date(top.updated_at).getTime()<=new Date(wm).getTime()) return false;
  }
  const since = wm ? new Date(new Date(wm).getTime()-3000).toISOString() : null;
  const idx={}; for(const k of KINDS) idx[k]=new Map((S[k]||[]).map(x=>[x.id,x]));
  let changed=false, from=0, maxT=wm?new Date(wm).getTime():0, maxS=wm;
  const PAGE=1000;
  for(;;){
    let q=sb.from(REC).select("kind,id,data,deleted,updated_at").eq("workshop_id",wid).order("updated_at",{ascending:true}).order("id",{ascending:true}).range(from,from+PAGE-1);
    if(since) q=q.gt("updated_at",since);
    const {data,error}=await q; if(error) throw error;
    for(const r of (data||[])){
      const t=new Date(r.updated_at).getTime(); if(t>=maxT){ maxT=t; maxS=r.updated_at; }
      const key=keyOf(r.kind,r.id);
      if(r.kind==="meta"){
        const rd=r.data||{}; const remote={settings:rd.settings||{},seq:Number(rd.seq)||0,demo:!!rd.demo,audit:(rd.audit||[]).slice(0,100)};
        const localDirty = baseMap.has(key) && baseMap.get(key)!==canon(metaOf(S));
        if(!localDirty){ if(canon(remote.settings)!==canon(S.settings)||remote.demo!==!!S.demo) changed=true; S.settings=remote.settings; S.demo=remote.demo; }
        if(remote.seq>(Number(S.seq)||0)){ S.seq=remote.seq; changed=true; }
        const au=new Map(); [...remote.audit,...(S.audit||[])].forEach(a=>au.set(a.id,a));
        S.audit=[...au.values()].sort((a,b)=>String(b.at).localeCompare(String(a.at))).slice(0,100);
        baseMap.set(key,canon(remote));
        continue;
      }
      if(!idx[r.kind]) continue;
      const local=idx[r.kind].get(r.id);
      const baseJson=baseMap.get(key);
      const localJson=local?canon(local):undefined;
      if(localJson!==baseJson){ if(r.deleted) baseMap.delete(key); else baseMap.set(key,canon(r.data)); continue; }
      if(r.deleted){
        if(local){ S[r.kind]=S[r.kind].filter(x=>x.id!==r.id); idx[r.kind].delete(r.id); changed=true; }
        baseMap.delete(key);
      } else {
        const nj=canon(r.data);
        if(!local || nj!==localJson){
          if(local){ const i=S[r.kind].findIndex(x=>x.id===r.id); S[r.kind][i]=r.data; } else S[r.kind].push(r.data);
          idx[r.kind].set(r.id,r.data); changed=true;
        }
        baseMap.set(key,nj);
      }
    }
    if((data||[]).length<PAGE) break;
    from+=PAGE;
  }
  if(maxS) wm=maxS;
  if(fixDupNos()){ changed=true; persist(); }
  cacheSoon();
  return changed;
}
async function cloudPush(){
  if(!sb||!wid) return;
  const cur=snapshotMap(S); const rows=[];
  for(const [key,json] of cur){ if(baseMap.get(key)!==json){ const [k,id]=splitKey(key); rows.push({workshop_id:wid,kind:k,id,data:JSON.parse(json),deleted:false,_j:json}); } }
  for(const key of Array.from(baseMap.keys())){ if(!cur.has(key)){ const [k,id]=splitKey(key); rows.push({workshop_id:wid,kind:k,id,data:{},deleted:true}); } }
  if(!rows.length) return;
  for(let i=0;i<rows.length;i+=200){
    const chunk=rows.slice(i,i+200);
    const {error}=await sb.from(REC).upsert(chunk.map(({_j,...r})=>r),{onConflict:"workshop_id,kind,id"});
    if(error) throw error;
    for(const r of chunk){ const key=keyOf(r.kind,r.id); if(r.deleted) baseMap.delete(key); else baseMap.set(key,r._j); }
  }
  cacheSoon();
}
async function refreshFromServer(){
  if(!authMode||!sb||!session||!profile||!S||dirty||saving||pulling||booting) return;
  if(workshopStatus && workshopStatus.status !== "active") return;
  if(($("#layer")?.innerHTML||"").trim()) return;
  pulling=true;
  try{ if(await cloudPull()) render(); }catch(e){}
  finally{ pulling=false; }
}
function persist(){ dirty=true; clearTimeout(saveTimer); saveTimer=setTimeout(flush,500); }
async function flush(){
  if(saving){ saveTimer=setTimeout(flush,400); return; }
  if(!dirty || !S || (authMode && !canEdit())) return;
  dirty=false; saving=true; const json=authMode?null:JSON.stringify(normalize(S));
  try{
    if(authMode && sb){ await cloudPush(); }
    else if(doc){ await doc.set({state:json,updatedAt:new Date().toISOString()}); }
    else localStorage.setItem(LS_KEY,json);
  }catch(e){
    try{ localStorage.setItem(LS_KEY,json||JSON.stringify(normalize(S))); toast(authMode?"السحابة لم تحفظ، هنعيد المحاولة":"تم الحفظ على الجهاز"); }catch(_){}
    if(authMode){ dirty=true; clearTimeout(saveTimer); saveTimer=setTimeout(flush,15000); }
  }
  saving=false;
}
let booting=false;
async function bootCloud(){
  if(booting) return; booting=true;
  try{
    S=await loadState();
    if(authMode && workshopStatus && workshopStatus.status !== "active"){
      renderWorkshopBlocked();
      return;
    }
    render();
  }
  catch(e){ console.error(e); toast("تعذر تحميل الحساب"); renderAuth(); }
  finally{ booting=false; }
}
function commit(action){ if(authMode && !canEdit()){ toast("حساب الفني للعرض فقط حاليًا"); return; } if(action && S){ S.audit=S.audit||[]; S.audit.unshift({id:uid("a"),at:new Date().toISOString(),action,user:session?.user?.email||"محلي"}); S.audit=S.audit.slice(0,200); } persist(); render(); }

function showAuthMessage(msg,type="info"){ const el=$("#authMsg"); if(el){ el.className=type+"-note"; el.textContent=msg; el.hidden=false; } }
function renderAuth(){
  if(!authMode) return;
  $("#tabs").innerHTML=""; $("#app").innerHTML=`<section class="auth"><div class="auth-card stack">
    <h2>ورشتي</h2><div class="muted">نظام إدارة الورشة — دخول آمن وحفظ على السحابة</div>
    <div class="auth-tabs"><button class="btn pri" id="loginTab">تسجيل الدخول</button><button class="btn" id="signupTab">إنشاء حساب مالك</button></div>
    <div id="authMsg" class="info-note" hidden></div>
    <form id="authForm" class="stack"><div class="f"><label>البريد الإلكتروني</label><input name="email" type="email" required autocomplete="email"></div><div class="f"><label>كلمة المرور</label><input name="password" type="password" minlength="6" required autocomplete="current-password"></div><div id="signupFields" hidden class="stack"><div class="f"><label>اسمك</label><input name="name" autocomplete="name"></div><div class="f"><label>اسم الورشة</label><input name="workshop" value="ورشتي"></div></div><button class="btn pri block" type="submit">دخول</button></form>
    <button class="btn sm" type="button" id="forgotBtn">نسيت كلمة المرور؟</button>
    <div class="muted">حسابات الفني والمدير وموظف الاستقبال بيعملها مالك الورشة من شاشة «الفريق والصلاحيات».</div>
