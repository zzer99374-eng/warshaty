/* Layout: RTL phone app. Sticky top bar, scrolling content, fixed bottom tab bar, bottom-sheet forms. */
:root{
  --bg:#e8ebed; --surface:#ffffff; --surface2:#f3f5f6; --ink:#17212a; --muted:#5d6b76; --line:#d5dbe0;
  --accent:#0d6b78; --accent-ink:#ffffff; --accent-soft:#d6ecee;
  --good:#1d7a46; --good-soft:#d9f0e2; --warn:#a85d00; --warn-soft:#fbe9cf; --bad:#b3261e; --bad-soft:#f8dad7; --info:#2f5fa8; --info-soft:#dce7f7;
  --font-body:"IBM Plex Sans Arabic","Segoe UI",Tahoma,sans-serif; --font-display:"Reem Kufi","IBM Plex Sans Arabic",Tahoma,sans-serif;
  --shadow:0 1px 2px rgba(23,33,42,.08),0 4px 14px rgba(23,33,42,.06);
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --bg:#10171c; --surface:#18222a; --surface2:#1f2b34; --ink:#e7edf1; --muted:#9aa9b4; --line:#2d3b46;
  --accent:#4fb6c4; --accent-ink:#06262b; --accent-soft:#17383d;
  --good:#58c486; --good-soft:#173525; --warn:#f0a948; --warn-soft:#3b2a10; --bad:#ff8a80; --bad-soft:#40201e; --info:#8db4f0; --info-soft:#1b2c47;
  --shadow:0 1px 2px rgba(0,0,0,.4),0 4px 14px rgba(0,0,0,.3); color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#10171c; --surface:#18222a; --surface2:#1f2b34; --ink:#e7edf1; --muted:#9aa9b4; --line:#2d3b46;
  --accent:#4fb6c4; --accent-ink:#06262b; --accent-soft:#17383d;

*{box-sizing:border-box}

table{width:100%;border-collapse:collapse;font-size:14px}
td,th{padding:7px 4px;text-align:right;border-bottom:1px solid var(--line);vertical-align:top}

td.n,th.n{text-align:left;font-variant-numeric:tabular-nums;white-space:nowrap}

.veil{position:fixed;inset:0;background:rgba(10,16,20,.5);z-index:20;display:flex;align-items:flex-end;justify-content:center}
.sheet{background:var(--surface);width:100%;max-width:760px;max-height:92%;overflow:auto;border-radius:20px 20px 0 0;padding:16px 16px calc(20px + env(safe-area-inset-bottom,0px))}

<script>
"use strict";
/* ---------- helpers ---------- */
const $ = (s, r=document) => r.querySelector(s);
const esc = v => String(v ?? "").replace(/[&<>"']/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const money = n => (Math.round((Number(n)||0)*100)/100).toLocaleString("en-US") + " جنيه";
const uid = p => p + Math.random().toString(36).slice(2,8) + Date.now().toString(36).slice(-3);
const pad = n => String(n).padStart(2,"0");
const dkey = d => { d = d || new Date(); return d.getFullYear()+"-"+pad(d.getMonth()+1)+"-"+pad(d.getDate()); };
const addDays = (n) => { const d = new Date(); d.setDate(d.getDate()+n); return d; };
const MONTHS = ["يناير","فبراير","مارس","أبريل","مايو","يونيو","يوليو","أغسطس","سبتمبر","أكتوبر","نوفمبر","ديسمبر"];
const DAYS = ["الأحد","الاثنين","الثلاثاء","الأربعاء","الخميس","الجمعة","السبت"];
const fdate = k => { if(!k) return ""; const [y,m,d] = k.split("-").map(Number); return d+" "+MONTHS[m-1]; };
const ftime = t => { if(!t) return ""; let [h,m] = t.split(":").map(Number); const ap = h>=12?"م":"ص"; h = h%12||12; return h+":"+pad(m)+" "+ap; };
const STATUS = [
  {k:"new",   t:"جديد",             c:"s-new"},
  {k:"check", t:"تحت الفحص",        c:"s-check"},
  {k:"wait",  t:"بانتظار موافقة العميل", c:"s-wait"},
  {k:"work",  t:"قيد الإصلاح",      c:"s-work"},
  {k:"ready", t:"جاهز",             c:"s-ready"},
  {k:"done",  t:"تم التسليم",       c:"s-done"}
];
const st = k => STATUS.find(s => s.k === k) || STATUS[0];
const VTYPE = {car:"سيارة", moto:"موتوسيكل", other:"غيره"};
const FUEL = ["فاضي","ربع","نص","ثلاثة أرباع","فول"];
const PAY = {cash:"كاش", transfer:"تحويل", card:"بطاقة"};

/* ---------- state + storage ---------- */
let S = null, db = null, doc = null, saveTimer = null, saving = false, dirty = false, storeKind = "local";
const LS_KEY = "warshaty-v1";
const CFG = window.WARSHATY_CONFIG || {};
let sb = null, session = null, profile = null, authMode = false, authBusy = false;
const role = () => profile?.role || "owner";
const isOwner = () => role() === "owner";
const canEdit = () => !authMode || isOwner();
function blank(){ return {customers:[],vehicles:[],parts:[],techs:[],jobs:[],appts:[],expenses:[],seq:1000,demo:false,settings:{name:"ورشتي",phone:"",address:"",currency:"جنيه"},audit:[]}; }

function seed(){
  const t = dkey(), y = dkey(addDays(-1)), d2 = dkey(addDays(-2)), tm = dkey(addDays(1));
  const s = blank(); s.demo = true; s.seq = 1004;
  s.customers = [
    {id:"c1",name:"أحمد محمد",phone:"01012345678",whatsapp:"01012345678",address:"مدينة نصر",notes:""},
    {id:"c2",name:"محمود السيد",phone:"01123456789",whatsapp:"",address:"",notes:"عميل دائم"},
    {id:"c3",name:"هدى علي",phone:"01234567890",whatsapp:"01234567890",address:"الدقي",notes:""}
  ];
  s.vehicles = [
    {id:"v1",customerId:"c1",type:"car",make:"BMW",model:"320i",year:2016,plate:"س ب ج 4521",chassis:"",color:"أبيض",km:84200,notes:""},
    {id:"v2",customerId:"c2",type:"moto",make:"هوندا",model:"CG 125",year:2020,plate:"م ص 9087",chassis:"",color:"أحمر",km:31000,notes:""},
    {id:"v3",customerId:"c3",type:"car",make:"هيونداي",model:"إلنترا",year:2019,plate:"ر ن ع 7733",chassis:"",color:"فضي",km:62000,notes:""}
  ];
  s.parts = [
    {id:"p1",name:"زيت 5W-30",number:"OIL-530",brand:"موبيل",buy:620,sell:700,qty:12,min:5,supplier:"شركة النور"},
    {id:"p2",name:"فلتر زيت",number:"OF-114",brand:"بوش",buy:120,sell:180,qty:6,min:5,supplier:"شركة النور"},
    {id:"p3",name:"سير مجموعة",number:"BLT-220",brand:"جيتس",buy:900,sell:1250,qty:3,min:2,supplier:"الأمل لقطع الغيار"},
    {id:"p4",name:"شداد سير",number:"TN-310",brand:"INA",buy:700,sell:950,qty:2,min:3,supplier:"الأمل لقطع الغيار"},
    {id:"p5",name:"طقم فرامل أمامي",number:"BR-052",brand:"فيرودو",buy:850,sell:1150,qty:4,min:2,supplier:"شركة النور"}
  ];
  s.techs = [
    {id:"t1",name:"محمد الفني",phone:"01011112222",spec:"ميكانيكا",pay:"يومية 400",hasAccount:false,accountEmail:""},
    {id:"t2",name:"كريم عبد الله",phone:"01022223333",spec:"كهرباء",pay:"أسبوعي 2500",hasAccount:false,accountEmail:""}
  ];
  s.jobs = [
    {id:"j1",no:1001,customerId:"c1",vehicleId:"v1",techId:"t1",createdAt:t+"T09:10",km:84200,fuel:"نص",condition:"خدوش بسيطة في الصدام",notes:"",complaint:"الموتور بيطلع صوت عند التسارع",diagnosis:"مشكلة في سير المجموعة",tasks:["فحص","تغيير سير","تغيير شداد","تجربة بعد الإصلاح"],status:"wait",approval:"pending",
      services:[{name:"أجرة تغيير سير وشداد",price:600}],parts:[{partId:"p3",name:"سير مجموعة",qty:1,price:1250},{partId:"p4",name:"شداد سير",qty:1,price:950}],payments:[]},
    {id:"j2",no:1002,customerId:"c2",vehicleId:"v2",techId:"t1",createdAt:y+"T11:30",km:31000,fuel:"ربع",condition:"",notes:"",complaint:"تغيير زيت دوري",diagnosis:"",tasks:["تغيير زيت","تغيير فلتر"],status:"work",approval:"none",
      services:[{name:"تغيير زيت",price:300}],parts:[{partId:"p1",name:"زيت 5W-30",qty:1,price:700},{partId:"p2",name:"فلتر زيت",qty:1,price:180}],payments:[{amount:500,method:"cash",date:t}]},
    {id:"j3",no:1003,customerId:"c3",vehicleId:"v3",techId:"t2",createdAt:d2+"T14:00",km:62000,fuel:"نص",condition:"",notes:"",complaint:"الفرامل بتصفر",diagnosis:"تيل الفرامل الأمامي خلص",tasks:["تغيير تيل فرامل أمامي"],status:"ready",approval:"approved",
      services:[{name:"أجرة تغيير فرامل",price:400}],parts:[{partId:"p5",name:"طقم فرامل أمامي",qty:1,price:1150}],payments:[{amount:1000,method:"cash",date:d2}]}
  ];
  s.appts = [
    {id:"a1",customerId:"c1",vehicleId:"v1",title:"صيانة دورية",date:tm,time:"17:00",done:false},
    {id:"a2",customerId:"c2",vehicleId:"v2",title:"فحص كهرباء",date:t,time:"18:30",done:false}
  ];
  s.expenses = [{id:"e1",title:"إيجار الورشة",amount:3000,date:t},{id:"e2",title:"كهرباء",amount:450,date:y}];
  return s;
}

function normalize(x){ const b = blank(); for(const k in b){ if(x && x[k] !== undefined) b[k] = x[k]; } return b; }

function supabaseReady(){ return !!(CFG.SUPABASE_URL && CFG.SUPABASE_ANON_KEY && !CFG.SUPABASE_URL.includes("YOUR_")); }

async function initAuth(){
  if(!supabaseReady()){ authMode = false; return null; }
  sb = window.supabase.createClient(CFG.SUPABASE_URL, CFG.SUPABASE_ANON_KEY);
  authMode = true;
  const {data} = await sb.auth.getSession(); session = data.session;
  sb.auth.onAuthStateChange((_event, s) => { session = s; if(s) bootCloud(); else { profile=null; S=null; renderAuth(); } });
  return session;
}

async function loadProfile(){
  if(!sb || !session) return null;
  const {data,error} = await sb.from("profiles").select("id,workshop_id,role,name,technician_id").eq("id",session.user.id).single();
  if(error) throw error; profile=data; return data;
}

async function loadState(){
  if(authMode){
    if(!session) return null;
    await loadProfile();
    const {data,error} = await sb.from("workshop_state").select("state").eq("workshop_id",profile.workshop_id).maybeSingle();
    if(error) throw error;
    storeKind="supabase";
    if(data?.state) return normalize(data.state);
    if(isOwner()){
      const fresh=blank();
      await sb.from("workshop_state").insert({workshop_id:profile.workshop_id,state:fresh});
      return fresh;
    }
    return blank();
  }
  try{
    const cl = window.claude && window.claude.use ? await window.claude.use("db") : null;
    if(cl){ db = cl; doc = db.doc("workshop/state"); const snap = await doc.get(); storeKind = "db"; if(snap.exists) return normalize(snap.data().state ? JSON.parse(snap.data().state) : snap.data()); return seed(); }
  }catch(e){ db=null; doc=null; }
  try{ const raw=localStorage.getItem(LS_KEY); if(raw) return normalize(JSON.parse(raw)); }catch(e){}
  return seed();
}

function persist(){ dirty=true; clearTimeout(saveTimer); saveTimer=setTimeout(flush,500); }
async function flush(){
  if(saving){ saveTimer=setTimeout(flush,400); return; }
  if(!dirty || !S || (authMode && !isOwner())) return;
  dirty=false; saving=true; const state=normalize(S); const json=JSON.stringify(state);
  try{
    if(authMode && sb){
      const {error}=await sb.from("workshop_state").upsert({workshop_id:profile.workshop_id,state,updated_at:new Date().toISOString()},{onConflict:"workshop_id"});
      if(error) throw error;
      S=state;
    } else if(doc){ await doc.set({state:json,updatedAt:new Date().toISOString()}); }
    else localStorage.setItem(LS_KEY,json);
  }catch(e){
    try{ localStorage.setItem(LS_KEY,json); toast(authMode?"السحابة لم تحفظ، اتحفظت نسخة محلية":"تم الحفظ على الجهاز"); }catch(_){}
  }
  saving=false;
}
async function bootCloud(){
  try{ S=await loadState(); render(); }
  catch(e){ console.error(e); toast("تعذر تحميل الحساب"); renderAuth(); }
}
function commit(action){ if(authMode && !isOwner()){ toast("حساب الفني للعرض فقط حاليًا"); return; } if(action && S){ S.audit=S.audit||[]; S.audit.unshift({id:uid("a"),at:new Date().toISOString(),action,user:session?.user?.email||"محلي"}); S.audit=S.audit.slice(0,200); } persist(); render(); }

function showAuthMessage(msg,type="info"){ const el=$("#authMsg"); if(el){ el.className=type+"-note"; el.textContent=msg; el.hidden=false; } }
function renderAuth(){
  if(!authMode) return;
  $("#tabs").innerHTML=""; $("#app").innerHTML=`<section class="auth"><div class="auth-card stack">
    <h2>ورشتي</h2><div class="muted">نظام إدارة الورشة — دخول آمن وحفظ على السحابة</div>
    <div class="auth-tabs"><button class="btn pri" id="loginTab">تسجيل الدخول</button><button class="btn" id="signupTab">إنشاء حساب مالك</button></div>
    <div id="authMsg" class="info-note" hidden></div>
    <form id="authForm" class="stack"><div class="f"><label>البريد الإلكتروني</label><input name="email" type="email" required autocomplete="email"></div><div class="f"><label>كلمة المرور</label><input name="password" type="password" minlength="6" required autocomplete="current-password"></div><div id="signupFields" hidden class="stack"><div class="f"><label>اسمك</label><input name="name" autocomplete="name"></div><div class="f"><label>اسم الورشة</label><input name="workshop" value="ورشتي"></div></div><button class="btn pri block" type="submit">دخول</button></form>
    <div class="muted">الفني لا يحتاج حسابًا إلا إذا اخترت له حسابًا من شاشة الفنيين.</div>
  </div></section>`;
  let signup=false; const form=$("#authForm"), sf=$("#signupFields"), submit=form.querySelector("button[type=submit]");
  $("#signupTab").onclick=()=>{signup=true;sf.hidden=false;submit.textContent="إنشاء حساب المالك";$("#signupTab").className="btn pri";$("#loginTab").className="btn";};
  $("#loginTab").onclick=()=>{signup=false;sf.hidden=true;submit.textContent="دخول";$("#loginTab").className="btn pri";$("#signupTab").className="btn";};
  form.onsubmit=async e=>{e.preventDefault(); if(authBusy)return; authBusy=true; submit.disabled=true; const d=Object.fromEntries(new FormData(form));
    try{ if(signup){ const {data,error}=await sb.auth.signUp({email:d.email,password:d.password,options:{data:{full_name:d.name||d.email.split("@")[0],workshop_name:d.workshop||"ورشتي"}}}); if(error)throw error; if(!data.session)showAuthMessage("تم إنشاء الحساب. لو طلب منك تأكيد البريد، أكده ثم سجل الدخول.","success"); else showAuthMessage("تم إنشاء الحساب.","success"); } else { const {error}=await sb.auth.signInWithPassword({email:d.email,password:d.password}); if(error)throw error; } }catch(err){showAuthMessage(err.message||"حصل خطأ","danger");} finally{authBusy=false;submit.disabled=false;}
  };
}
</script>
<script>
/* ---------- derived data ---------- */
const byId = (arr, id) => arr.find(x => x.id === id);
const cust = id => byId(S.customers, id);
const veh = id => byId(S.vehicles, id);
const tech = id => byId(S.techs, id);
const vLabel = v => v ? [v.make, v.model].filter(Boolean).join(" ") + (v.plate ? " · " + v.plate : "") : "—";
const jobSvc = j => j.services.reduce((a,s) => a + Number(s.price||0), 0);
const jobPts = j => j.parts.reduce((a,p) => a + Number(p.qty||0) * Number(p.price||0), 0);
const jobTotal = j => jobSvc(j) + jobPts(j);
const jobPaid = j => j.payments.reduce((a,p) => a + Number(p.amount||0), 0);
const jobDue = j => Math.max(0, jobTotal(j) - jobPaid(j));
const isOpen = j => j.status !== "done";
const custDue = id => S.jobs.filter(j => j.customerId === id).reduce((a,j) => a + jobDue(j), 0);
const custPaid = id => S.jobs.filter(j => j.customerId === id).reduce((a,j) => a + jobPaid(j), 0);
const lowParts = () => S.parts.filter(p => Number(p.qty) <= Number(p.min));
const payList = () => S.jobs.flatMap(j => j.payments.map(p => ({...p, job:j})));
const initial = n => (n||"؟").trim().charAt(0);
const waNum = p => { p = String(p||"").replace(/\D/g,""); if(!p) return ""; if(p.startsWith("0")) p = "20" + p.slice(1); return p; };
const waLink = (phone, text) => { const n = waNum(phone); return n ? "https://wa.me/" + n + "?text=" + encodeURIComponent(text) : ""; };

/* ---------- navigation ---------- */
let V = {name:"home", id:null, filter:"open", q:""};
const TABS = [
  {k:"home", t:"الرئيسية", i:'<path d="M3 11 12 4l9 7v9a1 1 0 0 1-1 1h-5v-6H9v6H4a1 1 0 0 1-1-1z"/>'},
  {k:"jobs", t:"الصيانة", i:'<path d="M14.7 6.3a4 4 0 0 0-5.4 5.4L3 18l3 3 6.3-6.3a4 4 0 0 0 5.4-5.4l-2.5 2.5-2.4-.6-.6-2.4z"/>'},
  {k:"customers", t:"العملاء", i:'<circle cx="12" cy="8" r="4"/><path d="M4 21a8 8 0 0 1 16 0"/>'},
  {k:"parts", t:"المخزون", i:'<path d="M21 8 12 3 3 8v8l9 5 9-5z"/><path d="m3 8 9 5 9-5M12 13v8"/>'},
  {k:"more", t:"المزيد", i:'<circle cx="5" cy="12" r="1.6"/><circle cx="12" cy="12" r="1.6"/><circle cx="19" cy="12" r="1.6"/>'}
];
const tabOf = n => ({job:"jobs",customer:"customers",appts:"more",techs:"more",reports:"more",expenses:"more",settings:"more"}[n] || n);
function go(name, id, extra){ V = Object.assign({name, id:id||null, filter:V.filter, q:""}, extra||{}); render(); window.scrollTo(0,0); }
function toast(msg){ const t = document.createElement("div"); t.className="toast"; t.textContent=msg; t.setAttribute("role","status"); document.body.appendChild(t); setTimeout(()=>t.remove(), 2200); }

/* ---------- views ---------- */
function vHome(){
  const today = dkey();
  const incomeToday = payList().filter(p => p.date === today).reduce((a,p) => a + Number(p.amount), 0);
  const open = S.jobs.filter(isOpen);
  const inShop = open.length;
  const doneCnt = S.jobs.filter(j => j.status === "ready" || j.status === "done").length;
  const due = S.jobs.reduce((a,j) => a + jobDue(j), 0);
  const apToday = S.appts.filter(a => a.date === today && !a.done).length;
  const low = lowParts();
  const cnt = k => S.jobs.filter(j => j.status === k).length;
  // last 7 days revenue
  const days = []; for(let i=6;i>=0;i--){ const d = addDays(-i); const k = dkey(d);
    days.push({k, label:DAYS[d.getDay()].replace("ال",""), v: payList().filter(p=>p.date===k).reduce((a,p)=>a+Number(p.amount),0)}); }
  const mx = Math.max(1, ...days.map(d => d.v));
  // top services
  const sc = {}; S.jobs.forEach(j => j.services.forEach(s => { sc[s.name] = (sc[s.name]||0) + 1; }));
  const top = Object.entries(sc).sort((a,b) => b[1]-a[1]).slice(0,4); const tmx = top.length ? top[0][1] : 1;
  // recent activity
  const recent = [...S.jobs].sort((a,b) => (b.createdAt||"").localeCompare(a.createdAt||"")).slice(0,4);
  return `
  ${S.demo ? `<div class="demo"><span>الأرقام دي بيانات تجريبية عشان تشوف الشكل.</span><button class="btn sm" data-act="clearDemo">ابدأ بيانات فاضية</button></div>`:""}
  <div class="card stack">
    <h3>النهاردة ${DAYS[new Date().getDay()]} ${new Date().getDate()} ${MONTHS[new Date().getMonth()]}</h3>
    <div class="stack" style="gap:6px">
      <div class="row"><span class="pill s-wait">${cnt("check")+cnt("new")}</span><span>سيارات تحتاج تشخيص</span></div>
      <div class="row"><span class="pill s-work">${cnt("work")+cnt("wait")}</span><span>قيد الإصلاح أو بانتظار موافقة</span></div>
      <div class="row"><span class="pill s-ready">${cnt("ready")}</span><span>جاهزة للتسليم</span></div>
    </div>
  </div>
  <div class="grid2 grid4" style="display:grid;grid-template-columns:1fr 1fr;gap:10px">
    <div class="stat"><span>دخل النهاردة</span><b>${money(incomeToday)}</b></div>
    <div class="stat"><span>مركبات في الورشة</span><b>${inShop}</b></div>
    <div class="stat"><span>مستحق من العملاء</span><b>${money(due)}</b></div>
    <div class="stat"><span>مواعيد النهاردة</span><b>${apToday}</b></div>
    <div class="stat"><span>أوامر مكتملة</span><b>${doneCnt}</b></div>
    <div class="stat"><span>قطع منخفضة المخزون</span><b>${low.length}</b></div>
  </div>
  ${low.length ? `<div class="stack">${low.map(p => `<div class="warn-line">⚠️ المخزون منخفض: ${esc(p.name)} (${p.qty})</div>`).join("")}</div>`:""}
  <div class="card stack">
    <div class="sec"><h3>الإيرادات آخر 7 أيام</h3><span class="muted">المدفوع فعليًا</span></div>
    <div class="bars" role="img" aria-label="رسم الإيرادات اليومية">${days.map(d => `<div class="bar"><em>${d.v ? Math.round(d.v) : ""}</em><i style="height:${Math.max(3, d.v/mx*80)}px"></i><span>${d.label}</span></div>`).join("")}</div>
  </div>
  <div class="card stack">
    <h3>أكتر الخدمات طلبًا</h3>
    ${top.length ? top.map(([n,c]) => `<div class="hbar"><span>${esc(n)}</span><div><i style="width:${c/tmx*100}%"></i></div><span class="num">${c}</span></div>`).join("") : `<div class="muted">هتظهر هنا بعد أول أمر صيانة.</div>`}
  </div>
  <div class="stack">
    <div class="sec"><h3>آخر أوامر الصيانة</h3><button class="btn sm" data-act="go" data-v="jobs">كل الأوامر</button></div>
    ${recent.length ? recent.map(jobItem).join("") : `<div class="empty">لسه مفيش أوامر صيانة.</div>`}
  </div>`;
}

function stepBar(j){ const i = STATUS.findIndex(s => s.k === j.status); return `<div class="steps" aria-hidden="true">${STATUS.map((s,x) => `<i class="${x<=i?"on":""}"></i>`).join("")}</div>`; }
function jobItem(j){
  const c = cust(j.customerId), v = veh(j.vehicleId), s = st(j.status);
  return `<button class="item" data-act="openJob" data-id="${j.id}"><div class="grow stack" style="gap:4px">
    <div class="row" style="justify-content:space-between"><span class="t">#${j.no} · ${esc(c ? c.name : "عميل محذوف")}</span><span class="pill ${s.c}">${s.t}</span></div>
    <div class="muted">${esc(vLabel(v))}</div>
    <div class="muted">${esc(j.complaint || "")}</div>${stepBar(j)}</div></button>`;
}

function vJobs(){
  const f = V.filter;
  const list = S.jobs.filter(j => f === "all" ? true : f === "open" ? isOpen(j) : j.status === f).sort((a,b) => b.no - a.no);
  const chips = [["open","المفتوحة"],["all","الكل"],...STATUS.map(s => [s.k, s.t])];
  return `<div class="sec"><h2>أوامر الصيانة</h2><button class="btn pri sm" data-act="newJob">+ أمر جديد</button></div>
  <div class="chips">${chips.map(([k,t]) => `<button class="chip" data-act="filter" data-id="${k}" aria-pressed="${f===k}">${t}</button>`).join("")}</div>
  <div class="stack">${list.length ? list.map(jobItem).join("") : `<div class="empty">مفيش أوامر في القائمة دي.</div>`}</div>`;
}

function vCustomers(){
  const list = [...S.customers].sort((a,b) => a.name.localeCompare(b.name, "ar"));
  return `<div class="sec"><h2>العملاء</h2><button class="btn pri sm" data-act="editCustomer">+ عميل</button></div>
  <div class="stack">${list.length ? list.map(c => { const d = custDue(c.id); return `<button class="item" data-act="openCustomer" data-id="${c.id}"><div class="avatar">${esc(initial(c.name))}</div><div class="grow"><div class="t">${esc(c.name)}</div><div class="muted num">${esc(c.phone||"")} · ${S.vehicles.filter(v=>v.customerId===c.id).length} مركبة</div></div>${d>0?`<span class="pill s-wait">عليه ${money(d)}</span>`:""}</button>`; }).join("") : `<div class="empty">ضيف أول عميل.</div>`}</div>`;
}

function vCustomer(){
  const c = cust(V.id); if(!c){ return `<div class="empty">العميل مش موجود.</div>`; }
  const vs = S.vehicles.filter(v => v.customerId === c.id);
  const js = S.jobs.filter(j => j.customerId === c.id).sort((a,b) => b.no - a.no);
  const visits = js.length, paid = custPaid(c.id), due = custDue(c.id);
  return `<div class="row"><button class="btn sm" data-act="go" data-v="customers">رجوع</button><h2 class="grow">${esc(c.name)}</h2><button class="btn sm" data-act="editCustomer" data-id="${c.id}">تعديل</button></div>
  <div class="card stack">
    <div class="num">${esc(c.phone||"—")}</div>
    ${c.whatsapp ? `<a class="btn sm" href="${waLink(c.whatsapp,"")}" target="_blank" rel="noopener">فتح واتساب</a>`:""}
    ${c.address ? `<div class="muted">${esc(c.address)}</div>`:""}${c.notes ? `<div class="muted">${esc(c.notes)}</div>`:""}
    <div class="grid2"><div class="stat"><span>عدد الزيارات</span><b>${visits}</b></div><div class="stat"><span>إجمالي المدفوع</span><b>${money(paid)}</b></div></div>
    <div class="stat"><span>المتبقي عليه</span><b style="color:${due>0?"var(--bad)":"var(--good)"}">${money(due)}</b></div>
  </div>
  <div class="sec"><h3>المركبات</h3><button class="btn sm" data-act="editVehicle" data-cid="${c.id}">+ مركبة</button></div>
  <div class="stack">${vs.length ? vs.map(v => { const last = S.jobs.filter(j => j.vehicleId === v.id).sort((a,b)=>b.no-a.no)[0];
    return `<div class="card stack"><div class="row"><div class="grow"><div class="t">${esc(VTYPE[v.type]||"")} ${esc(vLabel(v))}</div><div class="muted num">${esc(v.year||"")} ${esc(v.color||"")} · ${Number(v.km||0).toLocaleString("en-US")} كم</div></div><button class="btn sm" data-act="editVehicle" data-id="${v.id}" data-cid="${c.id}">تعديل</button></div>
    ${last ? `<div class="muted">آخر صيانة: ${fdate((last.createdAt||"").slice(0,10))} · ${esc(last.tasks.slice(0,2).join(" + ")||last.complaint)} · ${money(jobTotal(last))}</div>`:`<div class="muted">مفيش سجل صيانة.</div>`}
    <button class="btn sm" data-act="newJob" data-cid="${c.id}" data-vid="${v.id}">أمر صيانة جديد</button></div>`; }).join("") : `<div class="empty">ضيف مركبة للعميل.</div>`}</div>
  <h3>تاريخ التعامل</h3>
  <div class="stack">${js.length ? js.map(jobItem).join("") : `<div class="empty">مفيش زيارات لسه.</div>`}</div>
  <button class="btn bad block" data-act="delCustomer" data-id="${c.id}">حذف العميل</button>`;
}

function vParts(){
  const list = [...S.parts].sort((a,b) => a.name.localeCompare(b.name,"ar"));
  return `<div class="sec"><h2>قطع الغيار</h2><button class="btn pri sm" data-act="editPart">+ قطعة</button></div>
  <div class="stack">${list.length ? list.map(p => { const low = Number(p.qty) <= Number(p.min);
    return `<button class="item" data-act="editPart" data-id="${p.id}"><div class="grow"><div class="t">${esc(p.name)}</div><div class="muted">${esc(p.brand||"")} ${esc(p.number||"")} · بيع ${money(p.sell)}</div>${low?`<div class="warn-line" style="margin-top:6px">⚠️ المخزون منخفض (الحد الأدنى ${p.min})</div>`:""}</div><div class="stat" style="padding:6px 12px;text-align:center"><b style="color:${low?"var(--bad)":"var(--ink)"}">${p.qty}</b><span>متاح</span></div></button>`; }).join("") : `<div class="empty">ضيف أول قطعة غيار.</div>`}</div>`;
}

function vMore(){
  const it = (v,t,d) => `<button class="item" data-act="go" data-v="${v}"><div class="grow"><div class="t">${t}</div><div class="muted">${d}</div></div><span aria-hidden="true">‹</span></button>`;
  return `<h2>المزيد</h2><div class="stack">
  ${it("appts","المواعيد","حجوزات العملاء والتذكير")}
  ${it("techs","الفنيين","الفنيين وحساباتهم الاختيارية")}
  ${it("reports","التقارير","الدخل والمصروفات وصافي الربح")}
  ${it("expenses","المصروفات","إيجار، كهرباء، أدوات")}
  ${it("settings","الإعدادات والنسخ الاحتياطي","الحساب، البيانات، التصدير والاستيراد")}</div>
  <div class="card stack"><h3>الحفظ</h3><div class="muted">${storeKind==="supabase" ? `متصل بالسحابة · ${esc(session?.user?.email||"")} · ${role()==="owner"?"مالك":"فني"}` : "الوضع المحلي: البيانات على هذا الجهاز فقط."}</div></div>`;
}
function vSettings(){
  const cfg=S.settings||{};
  return `<div class="row"><button class="btn sm" data-act="go" data-v="more">رجوع</button><h2 class="grow">الإعدادات</h2></div>
  <div class="card stack"><h3>بيانات الورشة</h3>
    <div class="f"><label>اسم الورشة</label><input id="shopName" value="${esc(cfg.name||"ورشتي")}" ${!canEdit()?"disabled":""}></div>
    <div class="f"><label>رقم الهاتف</label><input id="shopPhone" value="${esc(cfg.phone||"")}" ${!canEdit()?"disabled":""}></div>
    <div class="f"><label>العنوان</label><input id="shopAddress" value="${esc(cfg.address||"")}" ${!canEdit()?"disabled":""}></div>
    ${canEdit()?`<button class="btn pri" data-act="saveSettings">حفظ بيانات الورشة</button>`:""}
  </div>
  <div class="settings-grid">
    <button class="btn" data-act="exportBackup">⬇️ نسخة احتياطية JSON</button>
    <button class="btn" data-act="importBackup">⬆️ استيراد نسخة</button>
    <button class="btn" data-act="exportCsv">📊 Excel / CSV</button>
    <button class="btn" data-act="importLocal">📥 نقل بيانات النسخة القديمة</button>
    <button class="btn" data-act="printPdf">🖨️ طباعة / حفظ PDF</button>
  </div>
  ${authMode?`<div class="card stack"><h3>الحساب</h3><div class="muted">${esc(session?.user?.email||"")} · ${role()==="owner"?"مالك الورشة":"حساب فني"}</div><button class="btn bad" data-act="signOut">تسجيل الخروج</button></div>`:""}
  <div class="card stack"><h3>سجل العمليات</h3>${(S.audit||[]).slice(0,20).map(a=>`<div class="row"><span class="grow">${esc(a.action)}</span><span class="muted">${esc(a.user||"")} · ${esc((a.at||"").slice(0,16).replace("T"," "))}</span></div>`).join("")||`<div class="muted">مفيش عمليات مسجلة لسه.</div>`}</div>`;
}
</script>
<script>
function vAppts(){
  const list = [...S.appts].sort((a,b) => (a.date+a.time).localeCompare(b.date+b.time));
  const today = dkey();
  const row = a => { const c = cust(a.customerId), v = veh(a.vehicleId);
    return `<div class="card stack"><div class="row"><div class="grow"><div class="t">${esc(c?c.name:"—")} · ${esc(v?[v.make,v.model].join(" "):"")}</div><div class="muted">${esc(a.title)}</div><div class="num" style="color:${a.date===today?"var(--accent)":"inherit"};font-weight:600">${a.date===today?"النهاردة":fdate(a.date)} — ${ftime(a.time)}</div></div>
    <div class="stack" style="gap:6px"><button class="btn sm" data-act="toggleAppt" data-id="${a.id}">${a.done?"رجّعه":"تم"}</button><button class="btn sm" data-act="editAppt" data-id="${a.id}">تعديل</button></div></div>
    ${c && c.phone ? remindBtn(a,c):""}</div>`; };
  const up = list.filter(a => !a.done), dn = list.filter(a => a.done);
  return `<div class="row"><button class="btn sm" data-act="go" data-v="more">رجوع</button><h2 class="grow">المواعيد</h2><button class="btn pri sm" data-act="editAppt">+ موعد</button></div>
  <div class="stack">${up.length ? up.map(row).join("") : `<div class="empty">مفيش مواعيد جاية.</div>`}</div>
  ${dn.length ? `<h3>اتنفذت</h3><div class="stack">${dn.map(row).join("")}</div>`:""}`;
}
function remindBtn(a,c){
  const txt = `أهلًا ${c.name}، تذكير بموعدك في الورشة ${a.date===dkey()?"النهاردة":"يوم "+fdate(a.date)} الساعة ${ftime(a.time)} (${a.title}).`;
  const l = waLink(c.whatsapp || c.phone, txt);
  return l ? `<a class="btn sm" href="${l}" target="_blank" rel="noopener">إرسال تذكير واتساب</a>` : "";
}

function vTechs(){
  return `<div class="row"><button class="btn sm" data-act="go" data-v="more">رجوع</button><h2 class="grow">الفنيين</h2><button class="btn pri sm" data-act="editTech">+ فني</button></div>
  <div class="stack">${S.techs.length ? S.techs.map(t => { const js = S.jobs.filter(j => j.techId === t.id); const done = js.filter(j => j.status==="ready"||j.status==="done");
    const val = done.reduce((a,j) => a + jobTotal(j), 0);
    return `<button class="item" data-act="editTech" data-id="${t.id}"><div class="avatar">${esc(initial(t.name))}</div><div class="grow"><div class="t">${esc(t.name)}</div><div class="muted">${esc(t.spec||"")} ${t.pay?"· "+esc(t.pay):""}</div><div class="muted num">مسند له ${js.filter(isOpen).length} · أنجز ${done.length} · قيمة ${money(val)}</div></div></button>`; }).join("") : `<div class="empty">ضيف أول فني.</div>`}</div>`;
}

function vExpenses(){
  const list = [...S.expenses].sort((a,b) => b.date.localeCompare(a.date));
  return `<div class="row"><button class="btn sm" data-act="go" data-v="more">رجوع</button><h2 class="grow">المصروفات</h2><button class="btn pri sm" data-act="editExpense">+ مصروف</button></div>
  <div class="stack">${list.length ? list.map(e => `<button class="item" data-act="editExpense" data-id="${e.id}"><div class="grow"><div class="t">${esc(e.title)}</div><div class="muted">${fdate(e.date)}</div></div><b class="num">${money(e.amount)}</b></button>`).join("") : `<div class="empty">مفيش مصروفات متسجلة.</div>`}</div>`;
}

function vReports(){
  const now = new Date(), mk = dkey(now).slice(0,7), today = dkey();
  const pays = payList(), inc = f => pays.filter(f).reduce((a,p) => a + Number(p.amount), 0);
  const incToday = inc(p => p.date === today), incMonth = inc(p => p.date.startsWith(mk));
  const expMonth = S.expenses.filter(e => e.date.startsWith(mk)).reduce((a,e) => a + Number(e.amount), 0);
  // cost of parts used in this month's jobs (by creation month)
  const cogs = S.jobs.filter(j => (j.createdAt||"").startsWith(mk)).reduce((a,j) => a + j.parts.reduce((s,p) => { const pr = byId(S.parts,p.partId); return s + Number(p.qty) * Number(pr ? pr.buy : 0); },0), 0);
  const net = incMonth - expMonth - cogs;
  const debts = S.customers.map(c => ({c, d:custDue(c.id)})).filter(x => x.d > 0).sort((a,b) => b.d-a.d);
  const visits = S.customers.map(c => ({c, n:S.jobs.filter(j => j.customerId===c.id).length})).filter(x => x.n>0).sort((a,b) => b.n-a.n).slice(0,5);
  const pc = {}; S.jobs.forEach(j => j.parts.forEach(p => { pc[p.name] = (pc[p.name]||0) + Number(p.qty); }));
  const topParts = Object.entries(pc).sort((a,b) => b[1]-a[1]).slice(0,5);
  const fault = {}; S.jobs.forEach(j => { const k = (j.diagnosis||j.complaint||"").trim(); if(k) fault[k] = (fault[k]||0)+1; });
  const faults = Object.entries(fault).sort((a,b)=>b[1]-a[1]).slice(0,5);
  const list = (arr, fmt) => arr.length ? `<div class="stack" style="gap:6px">${arr.map(fmt).join("")}</div>` : `<div class="muted">مفيش بيانات كفاية.</div>`;
  const li = (a,b) => `<div class="row" style="justify-content:space-between"><span>${a}</span><b class="num">${b}</b></div>`;
  return `<div class="row"><button class="btn sm" data-act="go" data-v="more">رجوع</button><h2 class="grow">التقارير</h2></div>
  <div class="grid2"><div class="stat"><span>دخل النهاردة</span><b>${money(incToday)}</b></div><div class="stat"><span>دخل ${MONTHS[now.getMonth()]}</span><b>${money(incMonth)}</b></div>
  <div class="stat"><span>مصروفات الشهر</span><b>${money(expMonth)}</b></div><div class="stat"><span>تكلفة القطع المستخدمة</span><b>${money(cogs)}</b></div></div>
  <div class="stat"><span>صافي الربح التقريبي للشهر</span><b style="color:${net>=0?"var(--good)":"var(--bad)"}">${money(net)}</b></div>
  <div class="card stack"><h3>الديون على العملاء</h3>${list(debts, x => li(esc(x.c.name), money(x.d)))}</div>
  <div class="card stack"><h3>العملاء الأكثر زيارة</h3>${list(visits, x => li(esc(x.c.name), x.n+" زيارة"))}</div>
  <div class="card stack"><h3>قطع الغيار الأكثر استخدامًا</h3>${list(topParts, x => li(esc(x[0]), x[1]))}</div>
  <div class="card stack"><h3>أكثر الأعطال تكرارًا</h3>${list(faults, x => li(esc(x[0]), x[1]))}</div>
  <div class="card stack"><h3>المخزون</h3>${li("إجمالي قيمة المخزون (سعر الشراء)", money(S.parts.reduce((a,p)=>a+Number(p.qty)*Number(p.buy),0)))}${li("قطع منخفضة", lowParts().length)}</div>
  <div class="muted">التصدير Excel/PDF هيتضاف في نسخة جاية.</div>`;
}

/* ---------- job detail ---------- */
function invoiceText(j){
  const c = cust(j.customerId), v = veh(j.vehicleId);
  const lines = [`فاتورة صيانة #${j.no}`, `العميل: ${c?c.name:""}`, `المركبة: ${vLabel(v)}`, ""];
  if(j.services.length){ lines.push("الخدمات:"); j.services.forEach(s => lines.push(`- ${s.name}: ${money(s.price)}`)); }
  if(j.parts.length){ lines.push("قطع الغيار:"); j.parts.forEach(p => lines.push(`- ${p.name} × ${p.qty}: ${money(p.qty*p.price)}`)); }
  lines.push("", `الإجمالي: ${money(jobTotal(j))}`, `المدفوع: ${money(jobPaid(j))}`, `المتبقي: ${money(jobDue(j))}`);
  return lines.join("\n");
}
function approvalText(j){
  const c = cust(j.customerId), v = veh(j.vehicleId);
  return `أهلًا ${c?c.name:""}، تم فحص ${vLabel(v)}.\nالتشخيص: ${j.diagnosis||"-"}\nالأعمال المقترحة: ${j.tasks.join("، ")||"-"}\nالتكلفة المتوقعة: ${money(jobTotal(j))}\nمن فضلك رد بـ (موافق) أو (رفض).`;
}

function vJob(){
  const j = byId(S.jobs, V.id); if(!j) return `<div class="empty">الأمر مش موجود.</div>`;
  const c = cust(j.customerId), v = veh(j.vehicleId), t = tech(j.techId), s = st(j.status);
  const idx = STATUS.findIndex(x => x.k === j.status), next = STATUS[idx+1];
  const tot = jobTotal(j), paid = jobPaid(j), due = jobDue(j);
  const apLbl = {none:"", pending:"بانتظار رد العميل", approved:"العميل وافق", rejected:"العميل رفض"}[j.approval];
  const wl = c ? waLink(c.whatsapp || c.phone, invoiceText(j)) : "";
  const wa = c ? waLink(c.whatsapp || c.phone, approvalText(j)) : "";
  return `<div class="row"><button class="btn sm" data-act="go" data-v="jobs">رجوع</button><h2 class="grow">أمر #${j.no}</h2><span class="pill ${s.c}">${s.t}</span></div>
  ${stepBar(j)}
  <div class="card stack">
    <div class="row"><div class="grow"><div class="t">${esc(c?c.name:"—")}</div><div class="muted num">${esc(c?c.phone:"")}</div></div><button class="btn sm" data-act="editJob" data-id="${j.id}">تعديل</button></div>
    <div>${esc(vLabel(v))}</div>
    <div class="muted num">دخول ${fdate((j.createdAt||"").slice(0,10))} ${ftime((j.createdAt||"").slice(11,16))} · ${Number(j.km||0).toLocaleString("en-US")} كم · وقود: ${esc(j.fuel||"—")}</div>
    ${j.condition ? `<div class="muted">حالة الاستلام: ${esc(j.condition)}</div>`:""}
    <div class="muted">الفني: ${esc(t?t.name:"لسه مفيش")}</div>
  </div>
  <div class="card stack">
    <h3>الشكوى</h3><div>${esc(j.complaint||"—")}</div>
    <h3>التشخيص</h3><div>${esc(j.diagnosis||"لسه ما اتشخصش")}</div>
    <h3>الأعمال المطلوبة</h3>${j.tasks.length ? `<ul style="margin:0;padding-inline-start:20px">${j.tasks.map(x => `<li>${esc(x)}</li>`).join("")}</ul>`:`<div class="muted">—</div>`}
  </div>
  <div class="card stack">
    <h3>موافقة العميل</h3>
    ${j.approval==="none" ? `<div class="muted">لو الإصلاح محتاج مبلغ إضافي، ابعت للعميل التكلفة واطلب موافقته.</div>` : `<div><span class="pill ${j.approval==="approved"?"s-ready":j.approval==="rejected"?"s-wait":"s-check"}">${apLbl}</span></div>`}
    <div class="row" style="flex-wrap:wrap">
      ${wa ? `<a class="btn sm" data-act="askApproval" data-id="${j.id}" href="${wa}" target="_blank" rel="noopener">إرسال طلب موافقة واتساب</a>` : `<button class="btn sm" data-act="askApproval" data-id="${j.id}">طلب موافقة</button>`}
      <button class="btn sm" data-act="approval" data-id="${j.id}" data-v="approved">العميل وافق</button>
      <button class="btn sm" data-act="approval" data-id="${j.id}" data-v="rejected">العميل رفض</button>
    </div>
  </div>
  <div class="card stack">
    <div class="sec"><h3>الخدمات</h3><button class="btn sm" data-act="addService" data-id="${j.id}">+ خدمة</button></div>
    ${j.services.length ? `<div class="scroll"><table>${j.services.map((x,i) => `<tr><td>${esc(x.name)}</td><td class="n">${money(x.price)}</td><td class="n"><button class="btn sm" data-act="delService" data-id="${j.id}" data-i="${i}" aria-label="حذف">×</button></td></tr>`).join("")}</table></div>`:`<div class="muted">لسه مفيش خدمات.</div>`}
  </div>
  <div class="card stack">
    <div class="sec"><h3>قطع الغيار</h3><button class="btn sm" data-act="addPart" data-id="${j.id}">+ قطعة</button></div>
    ${j.parts.length ? `<div class="scroll"><table>${j.parts.map((x,i) => `<tr><td>${esc(x.name)} × ${x.qty}</td><td class="n">${money(x.qty*x.price)}</td><td class="n"><button class="btn sm" data-act="delPart" data-id="${j.id}" data-i="${i}" aria-label="حذف">×</button></td></tr>`).join("")}</table></div>`:`<div class="muted">لسه مفيش قطع.</div>`}
    <div class="muted">القطعة بتنقص من المخزون أول ما تتضاف.</div>
  </div>
  <div class="card stack inv">
    <h3>الفاتورة</h3>
    <div class="row" style="justify-content:space-between"><span>الخدمات</span><span class="num">${money(jobSvc(j))}</span></div>
    <div class="row" style="justify-content:space-between"><span>قطع الغيار</span><span class="num">${money(jobPts(j))}</span></div>
    <div class="row" style="justify-content:space-between"><b>الإجمالي</b><b class="num">${money(tot)}</b></div>
    <div class="row" style="justify-content:space-between"><span>المدفوع</span><span class="num">${money(paid)}</span></div>
    <div class="row" style="justify-content:space-between"><b>المتبقي</b><b class="num" style="color:${due>0?"var(--bad)":"var(--good)"}">${money(due)}</b></div>
    ${j.payments.length ? `<div class="muted">الدفعات:</div>${j.payments.map((p,i) => `<div class="row" style="justify-content:space-between"><span class="muted">${fdate(p.date)} · ${PAY[p.method]||""}</span><span class="num">${money(p.amount)} <button class="btn sm" data-act="delPay" data-id="${j.id}" data-i="${i}" aria-label="حذف الدفعة">×</button></span></div>`).join("")}`:""}
    <div class="row" style="flex-wrap:wrap"><button class="btn pri sm" data-act="addPay" data-id="${j.id}">تسجيل دفعة</button>
    ${wl ? `<a class="btn sm" href="${wl}" target="_blank" rel="noopener">إرسال الفاتورة واتساب</a>`:""}
    <button class="btn sm" data-act="copyInvoice" data-id="${j.id}">نسخ نص الفاتورة</button></div>
  </div>
  <div class="stack">
    ${next ? `<button class="btn pri block" data-act="advance" data-id="${j.id}">انقل إلى: ${next.t}</button>`:""}
    ${idx > 0 ? `<button class="btn block" data-act="back" data-id="${j.id}">ارجع إلى: ${STATUS[idx-1].t}</button>`:""}
    <button class="btn bad block" data-act="delJob" data-id="${j.id}">حذف الأمر</button>
  </div>`;
}
</script>
<script>
/* ---------- sheets + form helpers ---------- */
const fld = (id, label, val, type, extra) => `<div class="f"><label for="${id}">${label}</label><input id="${id}" name="${id}" type="${type||"text"}" value="${esc(val ?? "")}" ${extra||""}></div>`;
const area = (id, label, val) => `<div class="f"><label for="${id}">${label}</label><textarea id="${id}" name="${id}">${esc(val ?? "")}</textarea></div>`;
const sel = (id, label, opts, cur) => `<div class="f"><label for="${id}">${label}</label><select id="${id}" name="${id}">${opts.map(([v,t]) => `<option value="${esc(v)}" ${String(v)===String(cur)?"selected":""}>${esc(t)}</option>`).join("")}</select></div>`;

function closeSheet(){ $("#layer").innerHTML = ""; }
function openSheet(title, body, onSubmit, submitLabel, onMount){
  const L = $("#layer");
  L.innerHTML = `<div class="veil" id="veil"><form class="sheet stack" id="sheetForm" role="dialog" aria-modal="true" aria-label="${esc(title)}"><h2>${esc(title)}</h2>${body}
    ${onSubmit ? `<div class="row"><button class="btn pri grow" type="submit">${submitLabel||"حفظ"}</button><button class="btn" type="button" data-close="1">إلغاء</button></div>` : `<button class="btn block" type="button" data-close="1">إغلاق</button>`}</form></div>`;
  const form = $("#sheetForm");
  $("#veil").addEventListener("click", e => { if(e.target.id === "veil" || e.target.dataset.close) closeSheet(); });
  form.addEventListener("submit", e => { e.preventDefault(); if(!onSubmit) return; const fd = Object.fromEntries(new FormData(form).entries()); if(onSubmit(fd) !== false) closeSheet(); });
  if(onMount) onMount(form);
  const first = form.querySelector("input,select,textarea"); if(first && matchMedia("(hover:hover)").matches) first.focus();
}
function confirmSheet(msg, yes, label){
  openSheet("تأكيد", `<div>${esc(msg)}</div>`, () => { yes(); }, label || "تأكيد");
}
const num = v => { const n = parseFloat(String(v).replace(/,/g,"")); return isNaN(n) ? 0 : n; };

/* ---------- entity forms ---------- */
function formCustomer(id){
  const c = id ? cust(id) : {name:"",phone:"",whatsapp:"",address:"",notes:""};
  openSheet(id ? "تعديل عميل" : "عميل جديد",
    fld("name","الاسم",c.name,"text","required")+fld("phone","رقم الهاتف",c.phone,"tel")+fld("whatsapp","واتساب (لو مختلف)",c.whatsapp,"tel")+fld("address","العنوان (اختياري)",c.address)+area("notes","ملاحظات",c.notes),
    d => { if(!d.name.trim()) return false;
      if(id){ Object.assign(c, {name:d.name.trim(),phone:d.phone,whatsapp:d.whatsapp,address:d.address,notes:d.notes}); }
      else { const n = {id:uid("c"),name:d.name.trim(),phone:d.phone,whatsapp:d.whatsapp,address:d.address,notes:d.notes}; S.customers.push(n); V = {name:"customer",id:n.id,filter:V.filter,q:""}; }
      commit(); });
}
function formVehicle(id, cid){
  const v = id ? veh(id) : {type:"car",make:"",model:"",year:"",plate:"",chassis:"",color:"",km:"",notes:""};
  openSheet(id ? "تعديل مركبة" : "مركبة جديدة",
    sel("type","النوع",Object.entries(VTYPE),v.type)+fld("make","الماركة",v.make,"text","required")+fld("model","الموديل",v.model)+fld("year","سنة الصنع",v.year,"number")+fld("plate","رقم اللوحة",v.plate)+fld("chassis","رقم الشاسيه (اختياري)",v.chassis)+fld("color","اللون",v.color)+fld("km","الكيلومترات الحالية",v.km,"number")+area("notes","ملاحظات",v.notes),
    d => { const o = {type:d.type,make:d.make.trim(),model:d.model,year:d.year,plate:d.plate,chassis:d.chassis,color:d.color,km:num(d.km),notes:d.notes};
      if(!o.make) return false;
      if(id) Object.assign(v, o); else S.vehicles.push(Object.assign({id:uid("v"),customerId:cid}, o));
      commit(); });
}
function formPart(id){
  const p = id ? byId(S.parts,id) : {name:"",number:"",brand:"",buy:"",sell:"",qty:0,min:2,supplier:""};
  openSheet(id ? "تعديل قطعة" : "قطعة جديدة",
    fld("name","اسم القطعة",p.name,"text","required")+fld("number","رقم القطعة",p.number)+fld("brand","الشركة المصنعة",p.brand)+
    `<div class="grid2">${fld("buy","سعر الشراء",p.buy,"number","step=any min=0")}${fld("sell","سعر البيع",p.sell,"number","step=any min=0")}${fld("qty","الكمية الحالية",p.qty,"number","min=0")}${fld("min","الحد الأدنى",p.min,"number","min=0")}</div>`+fld("supplier","المورد",p.supplier),
    d => { if(!d.name.trim()) return false; const o = {name:d.name.trim(),number:d.number,brand:d.brand,buy:num(d.buy),sell:num(d.sell),qty:num(d.qty),min:num(d.min),supplier:d.supplier};
      if(id) Object.assign(p, o); else S.parts.push(Object.assign({id:uid("p")}, o)); commit(); },
    "حفظ", form => { if(id){ const b = document.createElement("button"); b.type="button"; b.className="btn bad"; b.textContent="حذف القطعة"; b.onclick = () => { closeSheet(); confirmSheet("تحذف القطعة "+p.name+"؟", () => { S.parts = S.parts.filter(x => x.id!==id); commit(); }); }; form.appendChild(b); } });
}
function formTech(id){
  const t = id ? tech(id) : {name:"",phone:"",spec:"",pay:"",accountEmail:"",hasAccount:false};
  const hadAccount = !!t.hasAccount;
  const account = t.hasAccount ? "checked" : "";
  openSheet(id ? "تعديل فني" : "فني جديد",
    fld("name","الاسم",t.name,"text","required")+fld("phone","رقم الهاتف",t.phone,"tel")+fld("spec","التخصص",t.spec)+fld("pay","الراتب / نظام الأجر",t.pay)+
    `<div class="card stack"><h3>حساب دخول للفني (اختياري)</h3><label class="row"><input type="checkbox" name="makeAccount" ${account} ${t.hasAccount?"disabled":""}> <span>الفني يكون له حساب دخول</span></label>${t.hasAccount?`<div class="success-note">الحساب مرتبط بالبريد: ${esc(t.accountEmail||"غير معروف")}</div>`:fld("accountEmail","بريد الفني","","email")}</div>`,
    d => { if(!d.name.trim()) return false; const o = {name:d.name.trim(),phone:d.phone,spec:d.spec,pay:d.pay,accountEmail:d.accountEmail||t.accountEmail||"",hasAccount:t.hasAccount||d.makeAccount==="on"};
      if(o.hasAccount && !o.accountEmail){ toast("اكتب بريد الفني لإنشاء الحساب"); return false; }
      if(id) Object.assign(t,o); else { const n=Object.assign({id:uid("t")},o); S.techs.push(n); }
      commit("تعديل الفني");
      if(o.hasAccount && !hadAccount && authMode) setTimeout(()=>createTechAccount(id ? t : S.techs[S.techs.length-1]),100);
    },
    "حفظ", form => { if(id){ const b=document.createElement("button"); b.type="button"; b.className="btn bad"; b.textContent="حذف الفني"; b.onclick=()=>{ closeSheet(); confirmSheet("تحذف الفني "+t.name+"؟",()=>{S.techs=S.techs.filter(x=>x.id!==id);S.jobs.forEach(j=>{if(j.techId===id)j.techId=""});commit("حذف فني"); }); }; form.appendChild(b); } });
}
async function createTechAccount(t){
  if(!sb || !profile || !isOwner()){ toast("إنشاء حساب الفني يحتاج حساب المالك"); return; }
  try{
    const r=await fetch(`${CFG.SUPABASE_URL}/functions/v1/create-technician`,{method:"POST",headers:{Authorization:`Bearer ${session.access_token}`,"Content-Type":"application/json"},body:JSON.stringify({email:t.accountEmail,name:t.name,technician_id:t.id,workshop_id:profile.workshop_id})});
    const j=await r.json(); if(!r.ok) throw new Error(j.error||"تعذر إنشاء الحساب");
    t.hasAccount=true; t.authUserId=j.user_id; commit("إنشاء حساب فني");
    openSheet("بيانات دخول الفني",`<div class="success-note">اتعمل الحساب بنجاح. سلّم الفني البيانات دي مرة واحدة:</div><div class="card"><b>البريد:</b> ${esc(t.accountEmail)}<br><b>كلمة المرور المؤقتة:</b> <span class="num">${esc(j.temporary_password)}</span></div><div class="muted">الفني يقدر يغير كلمة المرور بعد تسجيل الدخول.</div>`,null,null);
  }catch(e){ toast(e.message||"حصل خطأ في إنشاء الحساب"); }
}
function custOptions(){ return S.customers.map(c => [c.id, c.name]); }
function vehOptions(cid){ return S.vehicles.filter(v => v.customerId === cid).map(v => [v.id, (VTYPE[v.type]||"")+" "+vLabel(v)]); }
function formAppt(id){
  if(!S.customers.length){ toast("ضيف عميل الأول"); return; }
  const a = id ? byId(S.appts,id) : {customerId:S.customers[0].id,vehicleId:"",title:"صيانة دورية",date:dkey(addDays(1)),time:"17:00"};
  openSheet(id ? "تعديل موعد" : "موعد جديد",
    sel("customerId","العميل",custOptions(),a.customerId)+`<div id="vSlot"></div>`+fld("title","نوع الخدمة",a.title,"text","required")+`<div class="grid2">${fld("date","التاريخ",a.date,"date","required")}${fld("time","الوقت",a.time,"time","required")}</div>`,
    d => { const o = {customerId:d.customerId,vehicleId:d.vehicleId,title:d.title.trim(),date:d.date,time:d.time}; if(!o.title||!o.date) return false; if(id) Object.assign(a,o); else S.appts.push(Object.assign({id:uid("a"),done:false},o)); commit(); },
    "حفظ", form => { const draw = () => { $("#vSlot").innerHTML = sel("vehicleId","المركبة",[["","—"],...vehOptions(form.customerId.value)],a.vehicleId); }; draw(); form.customerId.addEventListener("change", () => { a.vehicleId=""; draw(); });
      if(id){ const b = document.createElement("button"); b.type="button"; b.className="btn bad"; b.textContent="حذف الموعد"; b.onclick = () => { S.appts = S.appts.filter(x => x.id!==id); closeSheet(); commit(); }; form.appendChild(b); } });
}
function formExpense(id){
  const e = id ? byId(S.expenses,id) : {title:"",amount:"",date:dkey()};
  openSheet(id ? "تعديل مصروف" : "مصروف جديد", fld("title","البيان",e.title,"text","required")+fld("amount","المبلغ",e.amount,"number","step=any min=0 required")+fld("date","التاريخ",e.date,"date","required"),
    d => { const o = {title:d.title.trim(),amount:num(d.amount),date:d.date}; if(!o.title) return false; if(id) Object.assign(e,o); else S.expenses.push(Object.assign({id:uid("e")},o)); commit(); },
    "حفظ", form => { if(id){ const b = document.createElement("button"); b.type="button"; b.className="btn bad"; b.textContent="حذف"; b.onclick = () => { S.expenses = S.expenses.filter(x => x.id!==id); closeSheet(); commit(); }; form.appendChild(b); } });
}

/* ---------- job card form ---------- */
function formJob(id, cid, vid){
  if(!S.customers.length){ toast("ضيف عميل الأول من تبويب العملاء"); return; }
  const j = id ? byId(S.jobs,id) : {customerId:cid||S.customers[0].id,vehicleId:vid||"",techId:"",km:"",fuel:"نص",condition:"",complaint:"",diagnosis:"",tasks:[],notes:""};
  openSheet(id ? "تعديل أمر #"+j.no : "أمر صيانة جديد",
    sel("customerId","العميل",custOptions(),j.customerId)+`<div id="vSlot"></div>`+
    `<div class="grid2">${fld("km","الكيلومترات",j.km,"number")}${sel("fuel","مستوى الوقود",FUEL.map(x=>[x,x]),j.fuel)}</div>`+
    area("condition","حالة المركبة عند الاستلام",j.condition)+area("complaint","الشكوى",j.complaint)+area("diagnosis","التشخيص",j.diagnosis)+
    area("tasks","الأعمال المطلوبة (كل عمل في سطر)",j.tasks.join("\n"))+sel("techId","الفني المسؤول",[["","لسه مفيش"],...S.techs.map(t=>[t.id,t.name])],j.techId),
    d => { if(!d.vehicleId){ toast("اختار المركبة، أو ضيف مركبة للعميل الأول"); return false; }
      const o = {customerId:d.customerId,vehicleId:d.vehicleId,techId:d.techId,km:num(d.km),fuel:d.fuel,condition:d.condition,complaint:d.complaint,diagnosis:d.diagnosis,tasks:d.tasks.split("\n").map(x=>x.trim()).filter(Boolean)};
      if(id){ Object.assign(j,o); }
      else { S.seq += 1; const n = Object.assign({id:uid("j"),no:S.seq,createdAt:dkey()+"T"+pad(new Date().getHours())+":"+pad(new Date().getMinutes()),notes:"",status:"new",approval:"none",services:[],parts:[],payments:[]}, o);
        S.jobs.push(n); const v = veh(o.vehicleId); if(v && o.km) v.km = o.km; V = {name:"job",id:n.id,filter:V.filter,q:""}; }
      commit(); },
    "حفظ", form => { const draw = () => { $("#vSlot").innerHTML = sel("vehicleId","المركبة",[["","اختار المركبة"],...vehOptions(form.customerId.value)],j.vehicleId); };
      draw(); form.customerId.addEventListener("change", () => { j.vehicleId = ""; draw(); }); });
}

/* ---------- job sub-forms ---------- */
function formService(jid){
  openSheet("إضافة خدمة", fld("name","اسم الخدمة",SUGG[0],"text","required list=svcList")+`<datalist id="svcList">${SUGG.map(x=>`<option value="${esc(x)}">`).join("")}</datalist>`+fld("price","السعر","","number","step=any min=0 required"),
    d => { const j = byId(S.jobs,jid); if(!d.name.trim()) return false; j.services.push({name:d.name.trim(),price:num(d.price)}); commit(); });
}
const SUGG = ["تغيير زيت","أجرة صيانة","فحص كمبيوتر","تغيير فرامل","ظبط زوايا","غسيل وتشحيم"];
function formAddPart(jid){
  const avail = S.parts.filter(p => Number(p.qty) > 0);
  if(!avail.length){ toast("مفيش قطع متاحة في المخزون"); return; }
  openSheet("إضافة قطعة غيار", sel("partId","القطعة",avail.map(p => [p.id, p.name+" (متاح "+p.qty+")"]),avail[0].id)+`<div class="grid2">${fld("qty","الكمية",1,"number","min=1 step=1 required")}${fld("price","سعر البيع للعميل",avail[0].sell,"number","step=any min=0")}</div>`,
    d => { const j = byId(S.jobs,jid), p = byId(S.parts,d.partId), q = num(d.qty);
      if(!p || q < 1) return false; if(q > Number(p.qty)){ toast("المتاح من "+p.name+" هو "+p.qty+" فقط"); return false; }
      p.qty = Number(p.qty) - q; j.parts.push({partId:p.id,name:p.name,qty:q,price:num(d.price)});
      const low = Number(p.qty) <= Number(p.min); commit(); if(low) toast("⚠️ المخزون منخفض: "+p.name); },
    "إضافة", form => { form.partId.addEventListener("change", () => { const p = byId(S.parts, form.partId.value); if(p) form.price.value = p.sell; }); });
}
function formPay(jid){
  const j = byId(S.jobs,jid);
  openSheet("تسجيل دفعة", `<div class="muted">المتبقي: ${money(jobDue(j))}</div>`+fld("amount","المبلغ",jobDue(j)||"","number","step=any min=0 required")+sel("method","طريقة الدفع",Object.entries(PAY),"cash")+fld("date","التاريخ",dkey(),"date","required"),
    d => { const a = num(d.amount); if(a <= 0) return false; j.payments.push({amount:a,method:d.method,date:d.date}); commit(); });
}

/* ---------- search ---------- */
function openSearch(){
  openSheet("بحث", `<input class="search" id="q" type="search" placeholder="رقم اللوحة أو الهاتف أو اسم العميل أو رقم الأمر" autocomplete="off" aria-label="بحث"><div id="res" class="stack"></div>`, null, null, form => {
    const q = $("#q"), res = $("#res"); const run = () => {
      const t = q.value.trim().toLowerCase(); if(!t){ res.innerHTML = `<div class="muted">اكتب أي حاجة تعرفها عن العميل أو العربية.</div>`; return; }
      const out = [];
      S.customers.filter(c => c.name.toLowerCase().includes(t) || String(c.phone).includes(t) || String(c.whatsapp).includes(t)).forEach(c => out.push(`<button class="item" data-act="openCustomer" data-id="${c.id}"><div class="avatar">${esc(initial(c.name))}</div><div class="grow"><div class="t">${esc(c.name)}</div><div class="muted num">${esc(c.phone)}</div></div></button>`));
      S.vehicles.filter(v => String(v.plate).toLowerCase().includes(t) || String(v.chassis).toLowerCase().includes(t)).forEach(v => out.push(`<button class="item" data-act="openCustomer" data-id="${v.customerId}"><div class="grow"><div class="t">${esc(vLabel(v))}</div><div class="muted">${esc(cust(v.customerId)?.name||"")}</div></div></button>`));
      S.jobs.filter(j => String(j.no) === t.replace("#","")).forEach(j => out.push(jobItem(j)));
      res.innerHTML = out.length ? out.join("") : `<div class="empty">مفيش نتايج.</div>`; };
    q.addEventListener("input", run); run(); q.focus(); });
}
</script>
<script>
/* ---------- actions ---------- */
function restock(j){ j.parts.forEach(x => { const p = byId(S.parts, x.partId); if(p) p.qty = Number(p.qty) + Number(x.qty); }); }
const ACT = {
  go: el => go(el.dataset.v),
  filter: el => { V.filter = el.dataset.id; render(); },
  openJob: el => { closeSheet(); go("job", el.dataset.id); },
  openCustomer: el => { closeSheet(); go("customer", el.dataset.id); },
  newJob: el => formJob(null, el.dataset.cid, el.dataset.vid),
  editJob: el => formJob(el.dataset.id),
  editCustomer: el => formCustomer(el.dataset.id),
  editVehicle: el => formVehicle(el.dataset.id, el.dataset.cid),
  editPart: el => formPart(el.dataset.id),
  editTech: el => formTech(el.dataset.id),
  editAppt: el => formAppt(el.dataset.id),
  editExpense: el => formExpense(el.dataset.id),
  addService: el => formService(el.dataset.id),
  addPart: el => formAddPart(el.dataset.id),
  addPay: el => formPay(el.dataset.id),
  toggleAppt: el => { const a = byId(S.appts, el.dataset.id); a.done = !a.done; commit(); },
  clearDemo: () => confirmSheet("تمسح البيانات التجريبية وتبدأ بورشتك الفاضية؟", () => { S = blank(); persist(); render(); }, "امسح وابدأ"),
  delService: el => { byId(S.jobs, el.dataset.id).services.splice(Number(el.dataset.i), 1); commit(); },
  delPart: el => { const j = byId(S.jobs, el.dataset.id), x = j.parts[Number(el.dataset.i)], p = byId(S.parts, x.partId); if(p) p.qty = Number(p.qty) + Number(x.qty); j.parts.splice(Number(el.dataset.i), 1); commit(); toast("رجعت القطعة للمخزون"); },
  delPay: el => { byId(S.jobs, el.dataset.id).payments.splice(Number(el.dataset.i), 1); commit(); },
  askApproval: el => { const j = byId(S.jobs, el.dataset.id); j.approval = "pending"; j.status = "wait"; persist(); setTimeout(render, 50); },
  approval: el => { const j = byId(S.jobs, el.dataset.id); j.approval = el.dataset.v; if(el.dataset.v === "approved" && j.status === "wait") j.status = "work"; commit(); },
  advance: el => { const j = byId(S.jobs, el.dataset.id), i = STATUS.findIndex(s => s.k === j.status); if(STATUS[i+1]){ j.status = STATUS[i+1].k; if(j.status === "done" && jobDue(j) > 0) toast("تم التسليم، ومتبقي " + money(jobDue(j))); commit(); } },
  back: el => { const j = byId(S.jobs, el.dataset.id), i = STATUS.findIndex(s => s.k === j.status); if(i > 0){ j.status = STATUS[i-1].k; commit(); } },
  delJob: el => confirmSheet("تحذف أمر الصيانة ده؟ القطع المستخدمة هترجع للمخزون.", () => { const j = byId(S.jobs, el.dataset.id); restock(j); S.jobs = S.jobs.filter(x => x.id !== j.id); V = {name:"jobs",id:null,filter:V.filter,q:""}; commit(); }, "احذف"),
  delCustomer: el => { const id = el.dataset.id; if(S.jobs.some(j => j.customerId === id)){ toast("العميل عنده أوامر صيانة، مينفعش يتحذف"); return; }
    confirmSheet("تحذف العميل ومركباته؟", () => { S.vehicles = S.vehicles.filter(v => v.customerId !== id); S.appts = S.appts.filter(a => a.customerId !== id); S.customers = S.customers.filter(c => c.id !== id); V = {name:"customers",id:null,filter:V.filter,q:""}; commit(); }, "احذف"); },
  account: () => go("settings"),
  saveSettings: () => { S.settings=S.settings||{}; S.settings.name=$("#shopName").value.trim()||"ورشتي"; S.settings.phone=$("#shopPhone").value.trim(); S.settings.address=$("#shopAddress").value.trim(); commit("تعديل إعدادات الورشة"); toast("اتحفظت بيانات الورشة"); },
  exportBackup: () => { const blob=new Blob([JSON.stringify(S,null,2)],{type:"application/json"}); const a=document.createElement("a"); a.href=URL.createObjectURL(blob); a.download="warshaty-backup-"+dkey()+".json"; a.click(); setTimeout(()=>URL.revokeObjectURL(a.href),1000); },
  importBackup: () => { const i=document.createElement("input"); i.type="file"; i.accept="application/json,.json"; i.onchange=async()=>{ try{ const f=i.files[0]; if(!f)return; const x=normalize(JSON.parse(await f.text())); S=x; commit("استيراد نسخة احتياطية"); toast("تم استيراد النسخة"); }catch(e){toast("ملف النسخة غير صالح");} }; i.click(); },
  importLocal: () => { if(!canEdit()){toast("حساب الفني لا يقدر ينقل البيانات");return;} try{ const raw=localStorage.getItem(LS_KEY); if(!raw){toast("مفيش بيانات قديمة على الجهاز");return;} S=normalize(JSON.parse(raw)); commit("نقل بيانات النسخة القديمة"); toast("اتنقلت البيانات القديمة"); }catch(e){toast("بيانات النسخة القديمة غير صالحة");} },
  exportCsv: () => { const rows=[["أمر","العميل","المركبة","الحالة","الإجمالي","المدفوع","المتبقي","التاريخ"]]; S.jobs.forEach(j=>rows.push([j.no,cust(j.customerId)?.name||"",vLabel(veh(j.vehicleId)),st(j.status).t,jobTotal(j),jobPaid(j),jobDue(j),(j.createdAt||"").slice(0,10)])); const csv="\ufeff"+rows.map(r=>r.map(x=>`"${String(x??"").replace(/"/g,'""')}"`).join(",")).join("\n"); const a=document.createElement("a"); a.href=URL.createObjectURL(new Blob([csv],{type:"text/csv;charset=utf-8"})); a.download="warshaty-jobs-"+dkey()+".csv"; a.click(); },
  printPdf: () => window.print(),
  signOut: async () => { if(sb) await sb.auth.signOut(); },
  copyInvoice: el => { const t = invoiceText(byId(S.jobs, el.dataset.id));
    const done = () => toast("اتنسخت الفاتورة");
    if(navigator.clipboard && navigator.clipboard.writeText){ navigator.clipboard.writeText(t).then(done, () => fallbackCopy(t)); } else fallbackCopy(t); }
};
function fallbackCopy(t){ openSheet("نص الفاتورة", `<div class="f"><textarea id="cp" readonly style="min-height:200px">${esc(t)}</textarea></div>`, null, null, () => { const a = $("#cp"); a.focus(); a.select(); }); }

document.addEventListener("click", e => {
  const el = e.target.closest("[data-act]"); if(!el) return;
  const fn = ACT[el.dataset.act]; if(fn) { if(authMode && !isOwner() && !["go","filter","openJob","openCustomer","account"].includes(el.dataset.act)){ toast("حساب الفني للعرض فقط حاليًا"); return; } fn(el); }
});
$("#btnSearch").addEventListener("click", openSearch);

/* ---------- render ---------- */
const VIEWS = {home:vHome, jobs:vJobs, job:vJob, customers:vCustomers, customer:vCustomer, parts:vParts, more:vMore, appts:vAppts, techs:vTechs, reports:vReports, expenses:vExpenses, settings:vSettings};
function render(){
  const app = $("#app");
  if(!S){ app.innerHTML = `<div class="empty">جاري التحميل...</div>`; return; }
  const cur = tabOf(V.name);
  $("#tabs").innerHTML = TABS.map(t => `<button class="tab" data-act="go" data-v="${t.k}" ${cur===t.k?'aria-current="page"':""}><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">${t.i}</svg><span>${t.t}</span></button>`).join("");
  const y = window.scrollY;
  try { app.innerHTML = (VIEWS[V.name] || vHome)(); }
  catch(err){ console.error(err); app.innerHTML = `<div class="empty">حصلت مشكلة في عرض الصفحة. جرب ترجع للرئيسية.</div>`; }
  window.scrollTo(0, y);
}

/* ---------- boot ---------- */
(async()=>{
  try{ await initAuth(); if(authMode){ if(session) await bootCloud(); else renderAuth(); } else { S=await loadState(); render(); } }
  catch(e){ console.error(e); if(authMode) renderAuth(); else { S=seed(); render(); } }
})();
document.addEventListener("visibilitychange",()=>{if(document.visibilityState==="hidden")flush();});
window.addEventListener("pagehide",flush);
</script>

</body></html>
